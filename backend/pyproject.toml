[project]
name = "delivery-exception-backend"
version = "0.1.0"
description = "Delivery Exception Manager API, ADK agent, and MCP tools"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "firebase-admin>=6.7,<8",
  "google-cloud-firestore>=2.20,<3",
  "google-adk>=2.12,<2.13",
  "mcp>=1.12,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
eval = ["google-adk[eval]>=2.12,<2.13"]
observability = ["langfuse>=3,<5", "openinference-instrumentation-google-adk>=0.1,<1"]

[project.scripts]
logistics-api = "logistics_api.main:run"
logistics-mcp = "logistics_api.mcp_server:run"
logistics-agent = "logistics_api.agent_runtime:run"
logistics-feedback = "logistics_api.observability:feedback"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_api"]
